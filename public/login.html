<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LMS Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <img
        src="images/stemRepo.png"
        class="logo">

        <h1>Calatrava National High School</h1>

        <h4>Science, Technology, Engineering</h4>
        <h6>Learning Management System</h6>

    </div>


    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>Please login to continue.</p>


            <div class="role-selector">

                <button
                id="teacherBtn"
                class="active">

                Teacher

                </button>


                <button
                id="learnerBtn">

                Learner

                </button>

            </div>


            <form id="loginForm">

                <label
                id="usernameLabel">

                DepEd email

                </label>

                <input

                type="text"

                id="username"

                placeholder="Enter DepEd email"

                required>


                <label>

                Password

                </label>

                <input

                type="password"

                id="password"

                placeholder="Password"

                required>


                <button
                class="login-btn">

                Login

                </button>


                <div class="login-footer">

    <p>School Year 2026–2027</p>

    <p>
        © 2026 Francis Dominic N. Bermas, LPT, MIT(CAR)
    </p>

    <p>
        Learning Management System v1.0
    </p>

</div>

            </form>

        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
