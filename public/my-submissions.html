<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Submissions</title>

    <link rel="stylesheet" href="css/learner.css">

</head>

<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <img
                src="images/stemRepo.png"
                alt="School Logo"
                class="school-logo"
            >

            <h2>Student LMS</h2>

        </div>


        <nav>

            <a href="learner-dashboard.html">
                Dashboard
            </a>

            <a href="upload-activity.html">
                Upload Activity
            </a>

            <a
                href="my-submissions.html"
                class="active"
            >
                My Submissions
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <div class="page-header">

            <h1>
                My Submissions
            </h1>

            <p>
                View and manage your uploaded activities.
            </p>

        </div>


        <!-- SUBMISSION COUNT -->

        <p id="submissionCount">
            Total Uploaded Activities: 0
        </p>


        <!-- SUBMISSIONS TABLE -->

        <div class="submissions-card">

            <table id="submissionTable">

                <thead>

                    <tr>

                        <th>
                            Activity
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            Filename
                        </th>

                        <th>
                            Size
                        </th>

                        <th>
                            Submitted
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody>

                    <!-- JavaScript loads submissions here -->

                </tbody>

            </table>

        </div>


        <!-- BACK BUTTON -->

        <a
            href="learner-dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>


    </main>


    <script src="js/session.js"></script>

    <script src="js/my-submissions.js"></script>

    <script src="js/common.js"></script>

</body>

</html>
