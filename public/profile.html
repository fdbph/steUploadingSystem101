<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile</title>

    <link rel="stylesheet" href="css/learner.css">

</head>

<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <img
                src="images/stemRepo.png"
                alt="School Logo"
                class="school-logo"
            >

            <h2>Student LMS</h2>

        </div>


        <nav>

            <a href="learner-dashboard.html">
                Dashboard
            </a>

            <a href="upload-activity.html">
                Upload Activity
            </a>

            <a href="my-submissions.html">
                My Submissions
            </a>

            <a
                href="profile.html"
                class="active"
            >
                Profile
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <div class="page-header">

            <h1>
                My Profile
            </h1>

            <p>
                View your account information.
            </p>

        </div>


        <!-- PROFILE CARD -->

        <div class="profile-card">


            <div class="profile-row">

                <span class="profile-label">
                    Full Name
                </span>

                <span
                    class="profile-value"
                    id="fullname"
                >
                    Loading...
                </span>

            </div>


            <div class="profile-row">

                <span class="profile-label">
                    Role
                </span>

                <span
                    class="profile-value"
                    id="role"
                >
                    Loading...
                </span>

            </div>


        </div>


        <a
            href="learner-dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>


    </main>


    <script src="js/session.js"></script>

    <script src="js/profile.js"></script>

    <script src="js/common.js"></script>

</body>

</html>
