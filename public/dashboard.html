<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Dashboard</title>

    <link rel="stylesheet" href="css/teacher.css">

</head>

<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <img
                src="images/school-logo.png"
                alt="School Logo"
                class="school-logo"
            >

            <h2>Student LMS</h2>

        </div>


        <nav>

            <a
                href="dashboard.html"
                class="active"
            >
                Dashboard
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <div class="top-bar">

            <h1 id="welcomeMessage">
                Welcome
            </h1>

            <p>
                Teacher Dashboard
            </p>

        </div>


        <!-- DASHBOARD CARDS -->

        <div class="dashboard-grid">


            <div class="dashboard-card">

                <h3>
                    Total Learners
                </h3>

                <p id="totalLearners">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    Total Submissions
                </h3>

                <p id="totalSubmissions">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    Pending Submissions
                </h3>

                <p id="pendingSubmissions">
                    0
                </p>

            </div>


        </div>


        <!-- INFORMATION -->

        <section class="dashboard-section">

            <h2>
                Teacher Dashboard
            </h2>

            <p>
                This is your teacher area. You will be able
                to manage learner activities and submissions
                here.
            </p>

        </section>


    </main>


    <script src="js/session.js"></script>

    <script src="js/teacher.js"></script>

    <script src="js/common.js"></script>

</body>

</html>
