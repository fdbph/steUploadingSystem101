<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Learner Dashboard</title>

    <link rel="stylesheet" href="css/learner.css">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <img
                src="images/stemRepo.png"
                alt="School Logo"
                class="school-logo"
            >

            <h2>Student LMS</h2>

        </div>


        <nav>

            <a
                href="learner-dashboard.html"
                class="active"
            >
                Dashboard
            </a>

            <a href="upload-activity.html">
                Upload Activity
            </a>

            <a href="my-submissions.html">
                My Submissions
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <div class="top-bar">

            <h1 id="welcomeMessage">
                Welcome
            </h1>

        </div>


        <div class="dashboard-grid">


            <div class="dashboard-card">

                <h3>
                    Total Submissions
                </h3>

                <p id="totalUploads">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    Pending
                </h3>

                <p id="pendingActivities">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <h3>
                    Graded
                </h3>

                <p id="gradedActivities">
                    0
                </p>

            </div>


        </div>


        <!-- SUBMISSION SECTION -->

        <section class="submission-section">

            <h2>
                Student Submissions
            </h2>

            <p>
                Upload your completed activities and
                manage your submitted files.
            </p>


            <div class="submission-buttons">

                <a
                    href="upload-activity.html"
                    class="dashboard-btn"
                >
                    Upload Activity
                </a>


                <a
                    href="my-submissions.html"
                    class="dashboard-btn secondary"
                >
                    My Submissions
                </a>

            </div>

        </section>


    </main>


    <script src="js/session.js"></script>

    <script src="js/learner.js"></script>

    <script src="js/common.js"></script>

</body>

</html>
