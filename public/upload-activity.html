<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Activity</title>

    <link rel="stylesheet" href="css/learner.css">

</head>

<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <img
                src="images/stemRepo.png"
                alt="School Logo"
                class="school-logo"
            >

            <h2>Student LMS</h2>

        </div>


        <nav>

            <a href="learner-dashboard.html">
                Dashboard
            </a>

            <a
                href="upload-activity.html"
                class="active"
            >
                Upload Activity
            </a>

            <a href="my-submissions.html">
                My Submissions
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <div class="page-header">

            <h1>
                Upload Activity
            </h1>

            <p>
                Submit your completed activity by
                filling out the information below.
            </p>

        </div>


        <!-- UPLOAD CARD -->

        <div class="upload-card">


            <form
                id="uploadForm"
                enctype="multipart/form-data"
            >


                <!-- ACTIVITY TITLE -->

                <div class="form-group">

                    <label for="activityTitle">
                        Activity Title
                    </label>

                    <input
                        type="text"
                        id="activityTitle"
                        placeholder="Enter activity title"
                        required
                    >

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="Enter subject"
                        required
                    >

                </div>


                <!-- FILE -->

                <div class="form-group">

                    <label for="activityFile">
                        Activity File
                    </label>


                    <div class="file-upload">

                        <input
                            type="file"
                            id="activityFile"
                            required
                        >

                        <label
                            for="activityFile"
                            class="file-label"
                        >
                            Choose File
                        </label>

                    </div>


                    <p
                        id="selectedFile"
                        class="selected-file"
                    >
                        No file selected
                    </p>


                    <small>
                        Maximum file size: 25 MB
                    </small>

                </div>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                >
                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="uploadBtn"
                    class="upload-btn"
                >
                    Upload Activity
                </button>


            </form>


        </div>


        <a
            href="learner-dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>


    </main>


    <script src="js/session.js"></script>

    <script src="js/upload.js"></script>

    <script src="js/common.js"></script>

</body>

</html>
